name: Request review

on:
  pull_request:
    types: [review_requested]

jobs:
  approval-gate:
    name: Approval gate
    # Runs started by bots (GitHub Apps) wait for a reviewer of the bot-approval environment
    if: endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    environment: bot-approval
    steps:
      - run: echo "Approved to run for ${{ github.actor }}"

  RequestReview_job:
    needs: approval-gate
    name: Request review
    runs-on: ubuntu-latest
    # For external PR, ticket should be moved manually
    if: |
      !cancelled() && contains(fromJSON('["success","skipped"]'), needs.approval-gate.result)
      && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Report review request
        run: |
          echo "Review requested on PR #${{ github.event.pull_request.number }}"
