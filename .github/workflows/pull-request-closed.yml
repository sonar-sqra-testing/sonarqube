name: Pull Request Closed

on:
  pull_request:
    types: [closed]

jobs:
  approval-gate:
    name: Approval gate
    # Runs started by bots (GitHub Apps) wait for a reviewer of the bot-approval environment
    if: endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    environment: bot-approval
    steps:
      - run: echo "Approved to run for ${{ github.actor }}"

  PullRequestClosed_job:
    needs: approval-gate
    name: Pull Request Closed
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    # For external PR, ticket should be moved manually
    if: |
      !cancelled() && contains(fromJSON('["success","skipped"]'), needs.approval-gate.result)
      && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Report PR closed
        run: |
          echo "PR #${{ github.event.pull_request.number }} closed (merged=${{ github.event.pull_request.merged }})"
