name: Submit Review

on:
  pull_request_review:
    types: [submitted]

jobs:
  approval-gate:
    name: Approval gate
    # Runs started by bots (GitHub Apps) wait for a reviewer of the bot-approval environment
    if: endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    environment: bot-approval
    steps:
      - run: echo "Approved to run for ${{ github.actor }}"

  SubmitReview_job:
    needs: approval-gate
    name: Submit Review
    runs-on: ubuntu-latest
    # For external PR, ticket should be moved manually
    if: |
      !cancelled() && contains(fromJSON('["success","skipped"]'), needs.approval-gate.result)
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.review.state == 'changes_requested'
          || github.event.review.state == 'approved')
    steps:
      - name: Report review
        run: |
          echo "Review ${{ github.event.review.state }} on PR #${{ github.event.pull_request.number }} by ${{ github.event.review.user.login }}"
