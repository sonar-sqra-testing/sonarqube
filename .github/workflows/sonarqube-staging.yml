name: SonarQube Cloud (staging) CI analysis

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Cloud scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=sonar-sqra-testing_sonarqube
            -Dsonar.organization=sonar-sqra-testing
            -Dsonar.scanner.sonarcloudUrl=https://sc-staging.io
            -Dsonar.scanner.apiBaseUrl=https://api.sc-staging.io
